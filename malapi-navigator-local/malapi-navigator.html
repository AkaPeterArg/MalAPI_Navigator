<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MalAPI Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eceee9; --panel:#f7f8f5; --raised:#ffffff; --ink:#1c2530; --ink2:#5a6570; --ink3:#86909a;
  --rule:#cdd3cb; --rule2:#dde2da; --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#dbe6f1;
  --cell:#fbfcfa; --cell-ink:#26303a; --danger:#a83232; --ok:#3d7a4f;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --panel:#1b1f24; --raised:#23282e; --ink:#e1e6e9; --ink2:#9aa5ae; --ink3:#6f7a84;
    --rule:#343b43; --rule2:#2a3037; --accent:#86aede; --accent-ink:#0f1a26; --accent-soft:#233447;
    --cell:#21262c; --cell-ink:#d3dae0; --danger:#e07a7a; --ok:#7cc08f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --panel:#1b1f24; --raised:#23282e; --ink:#e1e6e9; --ink2:#9aa5ae; --ink3:#6f7a84;
  --rule:#343b43; --rule2:#2a3037; --accent:#86aede; --accent-ink:#0f1a26; --accent-soft:#233447;
  --cell:#21262c; --cell-ink:#d3dae0; --danger:#e07a7a; --ok:#7cc08f; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:0 16px;padding:10px 16px 0;border-bottom:1px solid var(--rule);background:var(--panel);min-width:0}
.brand{display:flex;flex-direction:column;padding-bottom:0;flex:none}
.brand strong{font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink2)}
.tabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;order:3;flex:1 1 100%;min-width:0;scrollbar-width:thin;margin-top:4px}
.tab{border:1px solid transparent;border-bottom:none;background:none;padding:8px 12px 9px;border-radius:6px 6px 0 0;white-space:nowrap;color:var(--ink2);display:flex;gap:8px;align-items:center;max-width:360px;flex:none}
.tab .tname{overflow:hidden;text-overflow:ellipsis}
.tab .tcount{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tab:hover{color:var(--ink);background:var(--rule2)}
.tab[aria-selected="true"]{background:var(--bg);border-color:var(--rule);color:var(--ink);font-weight:600;margin-bottom:-1px;padding-bottom:10px}
.tab.add{color:var(--accent);font-weight:500}
.savestate{font-size:12px;color:var(--ink2);white-space:nowrap;flex:0 1 auto;min-width:0;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.savestate.err{color:var(--danger)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--bg)}
.tgroup{display:flex;gap:6px;align-items:center}
.toolbar label.inl{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.search{position:relative}
.search input{width:220px;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--raised)}
select,input[type=number],input[type=text],textarea{border:1px solid var(--rule);border-radius:6px;background:var(--raised);padding:5px 8px}
.btn{border:1px solid var(--rule);background:var(--raised);border-radius:6px;padding:6px 11px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:4px 6px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.spacer{flex:1}

/* ---------- layout ---------- */
.layout{flex:1;min-height:0;display:flex}
.matrix-wrap{flex:1;min-width:0;overflow:auto;padding:0 16px 24px;position:relative}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 0 10px;font-size:12.5px;color:var(--ink2)}
.legend .gbar{display:flex;align-items:center;gap:8px}
.legend .gbar i{display:block;width:160px;height:10px;border-radius:2px;border:1px solid var(--rule)}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.callout{border:1px dashed var(--ink3);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--ink);background:var(--panel);margin-bottom:10px}

.matrix{display:grid;gap:8px;align-items:start;min-width:min-content}
.col{min-width:0}
.colhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 2px 8px;border-bottom:2px solid var(--ink)}
.ch-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ch-name{font-weight:700;font-size:13.5px;letter-spacing:-.005em}
.ch-count{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ch-sub{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-top:1px}
.ch-bar{height:5px;background:var(--rule2);margin-top:6px;border-radius:1px;overflow:hidden}
.ch-bar i{display:block;height:100%;background:var(--ink)}
.cells{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.cell{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid var(--rule2);background:var(--bg-cell,var(--cell));color:var(--fg-cell,var(--cell-ink));border-radius:3px;padding:3px 6px;font:12px/1.35 var(--mono);min-height:24px;position:relative}
.cell:hover{border-color:var(--ink3)}
.cell .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .mc{font:10.5px/1 var(--sans);opacity:.75;flex:none}
.cell .sc{font:600 11px/1 var(--sans);font-variant-numeric:tabular-nums;flex:none;padding:2px 4px;border-radius:2px;background:rgba(0,0,0,.14)}
.cell.hascomment::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--fg-cell,var(--ink2)) transparent transparent;opacity:.7}
.cell.sel{outline:2px solid var(--accent);outline-offset:0;z-index:1}
.cell.dim{opacity:.22}
.cell.hit{box-shadow:inset 3px 0 0 var(--accent)}
.dense .cell{min-height:19px;padding:1px 5px;font-size:11px}
.dense .cells{gap:1px}
.empty-col{font-size:12px;color:var(--ink3);padding:8px 2px}

/* ---------- panel ---------- */
.panel{width:370px;flex:none;border-left:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;border-bottom:1px solid var(--rule);padding:0 8px;flex:none}
.ptab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 10px 8px;color:var(--ink2);font-weight:500}
.ptab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pclose{margin-left:auto;align-self:center}
.hctrl{display:flex;gap:4px;align-items:center;padding-bottom:0;flex:none;margin-left:auto}
.ib{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--rule);border-radius:6px;background:var(--raised);color:var(--ink2);font-size:12.5px;font-weight:500}
.ib svg{width:16px;height:16px;flex:none}
.ib:hover{color:var(--ink);border-color:var(--ink3)}
.ib[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.no-toolbar .toolbar{display:none}
.no-legend #legend{display:none}
.panel-note{font-size:12.5px;color:var(--ink2);padding:0 0 8px}
@media (min-width:901px){ .no-panel .panel{display:none} }
body,.panel,.top,.toolbar,.cell,.colhead{transition:background-color .18s,color .18s,border-color .18s}
.pbody{overflow:auto;padding:16px 18px 28px;flex:1}
.pbody h2{font:600 19px/1.25 var(--mono);margin:0 0 4px;word-break:break-all}
.pbody h3{font-size:13px;margin:22px 0 8px;color:var(--ink);font-weight:700}
.pbody h3:first-child{margin-top:0}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.chip{border:1px solid var(--rule);border-radius:99px;padding:1px 9px;font-size:12px;background:var(--raised)}
button.chip:hover{border-color:var(--accent)}
.chip.api{font-family:var(--mono);font-size:11.5px}
.desc{margin:10px 0;line-height:1.55}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field > span{font-size:12.5px;color:var(--ink2);font-weight:500}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%}
.field textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .field{flex:1;min-width:0}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.quick button{min-width:32px;border:1px solid var(--rule);background:var(--raised);border-radius:4px;padding:4px 7px;font-variant-numeric:tabular-nums}
.quick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swatches{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sw{width:24px;height:24px;border-radius:4px;border:1px solid rgba(0,0,0,.2);padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:1px}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%),var(--raised)}
input[type=color]{width:30px;height:26px;padding:0 2px;border:1px solid var(--rule);border-radius:4px;background:var(--raised)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t td,table.t th{padding:5px 4px;border-bottom:1px solid var(--rule2);text-align:left;vertical-align:top}
table.t th{color:var(--ink2);font-weight:500}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.2);vertical-align:-1px}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.5}
.kbd{font:11px var(--mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--raised)}

/* profile */
.stat-line{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 4px}
.stat-line div{display:flex;flex-direction:column}
.stat-line b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat-line span{font-size:12px;color:var(--ink2)}
.prow{padding:9px 0;border-bottom:1px solid var(--rule2)}
.prow-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.prow-top b{font-size:13px}
.prow-top span{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pbar{height:6px;background:var(--rule2);border-radius:1px;margin:5px 0 6px;overflow:hidden}
.pbar i{display:block;height:100%}
.pat{border:1px solid var(--rule);border-radius:6px;padding:9px 11px;margin:8px 0;background:var(--raised)}
.pat.full{border-left:4px solid var(--ink)}
.pat.partial{border-left:4px dashed var(--ink3)}
.pat-top{display:flex;justify-content:space-between;gap:8px}
.pat-top b{font-size:13px}
.pat-top span{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.pat p{margin:4px 0;font-size:12.5px;color:var(--ink2)}
.miss{font-size:12px;color:var(--ink2)}
.miss code{font-family:var(--mono);font-size:11.5px}
.note{font-size:12px;color:var(--ink2);border-top:1px solid var(--rule);padding-top:10px;margin-top:18px;line-height:1.5}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--rule);border-radius:10px;padding:0;background:var(--panel);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100% - 40px);box-shadow:0 20px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(15,20,25,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
.dlg-h h2{margin:0;font-size:16px}
.dlg-b{padding:14px 18px;overflow:auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg textarea.big{width:100%;min-height:190px;font:12px/1.45 var(--mono)}
.choice{display:flex;flex-direction:column;gap:6px}
.choice button{text-align:left;border:1px solid var(--rule);background:var(--raised);border-radius:8px;padding:10px 12px}
.choice button:hover{border-color:var(--accent)}
.choice button b{display:block;font-size:14px}
.choice button span{font-size:12.5px;color:var(--ink2)}
.preview{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--accent-soft);margin-top:8px}
.preview.err{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.lyrlist label{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--rule2)}
.lyrlist .letter{font:600 12px var(--mono);width:22px;height:22px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:var(--rule2);color:var(--ink2)}
.lyrlist .letter.on{background:var(--ink);color:var(--bg)}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.presets button{font-size:12px;border:1px solid var(--rule);background:var(--raised);border-radius:4px;padding:3px 8px}
.expr{font-family:var(--mono)!important}
.wgrid{display:grid;grid-template-columns:1fr 90px;gap:6px 12px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.menu{position:fixed;z-index:60;background:var(--raised);border:1px solid var(--rule);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:6px;width:300px;max-width:calc(100vw - 16px)}
.menu .mi{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:6px;color:var(--ink)}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--rule2)}
.menu .mi b{font-weight:600;font-size:13px}
.menu .mi span{font-size:12px;color:var(--ink2)}
.menu hr{border:none;border-top:1px solid var(--rule2);margin:4px 0}
.menu label{display:flex;gap:8px;align-items:center;padding:7px 10px;font-size:12.5px;color:var(--ink2)}
dialog.wide{width:min(1500px,calc(100vw - 24px));height:calc(100% - 32px);max-height:none}
dialog.wide .dlg{height:100%;max-height:none}
dialog.wide .dlg-b{padding:0;flex:1;min-height:0;overflow:hidden}
.rv{display:grid;grid-template-columns:310px 1fr;height:100%;min-height:0}
.rv-opts{overflow:auto;padding:14px 16px;border-right:1px solid var(--rule)}
.rv-opts fieldset{border:none;padding:0;margin:0 0 14px}
.rv-opts legend{font-weight:700;font-size:13px;margin-bottom:4px;padding:0}
.rv-opts .field{margin:6px 0}
.rv-opts label.inl{display:flex;gap:6px;align-items:center;margin:4px 0}
.rv-prev{overflow:auto;background:var(--rule2);padding:18px;display:flex;justify-content:center;align-items:flex-start}
.rv-prev svg{max-width:100%;height:auto;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:none;background:var(--raised);padding:4px 10px;font-size:12.5px;color:var(--ink)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink);color:var(--bg)}
.lg-row{display:flex;gap:6px;align-items:center;margin:5px 0}
.legend .li{display:inline-flex;gap:5px;align-items:center}
.legend .li i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.toast.act{pointer-events:auto;display:flex;gap:14px;align-items:center}
.toast button{background:none;border:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:2px 0}
.choice button:disabled{opacity:.5;cursor:default}
.choice button.danger b{color:var(--danger)}
.fab{display:none}

@media (max-width:900px){
  .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:min(70%,560px);border-left:none;border-top:1px solid var(--rule);transform:translateY(105%);transition:transform .22s;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px rgba(0,0,0,.2)}
  .panel.open{transform:none}
  .hctrl{padding-bottom:0}
  .ib .lbl{display:none}
  .ib{padding:0 8px}
  .fab{display:inline-flex;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .search input{width:100%}
  .search{flex:1 1 100%}
  .brand span{display:none}
  .top{flex-wrap:wrap;gap:2px 12px;padding-top:8px}
  .brand{padding-bottom:0}
  .savestate{padding-bottom:0;font-size:11.5px;margin-left:auto}
  .tabs{order:3;flex-basis:100%}
  .tgroup{flex-wrap:wrap}
  .toolbar{padding:8px 12px;gap:8px}
  .spacer{display:none}
  .matrix-wrap{padding:0 12px 80px}
}
@media (max-width:820px){ .rv{grid-template-columns:1fr;grid-template-rows:auto 1fr} .rv-opts{max-height:45vh;border-right:none;border-bottom:1px solid var(--rule)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><strong>MalAPI Navigator</strong><span id="brandSub"></span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Capas"></nav>
  <div class="hctrl" role="group" aria-label="Vista">
    <button class="ib" data-act="toggleToolbar" id="ibToolbar" title="Mostrar u ocultar la barra de herramientas (tecla B)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M1.5 6h13"/></svg><span class="lbl">Barra</span></button>
    <button class="ib" data-act="toggleLegend" id="ibLegend" title="Mostrar u ocultar la leyenda (tecla L)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 5h12M2 8h8M2 11h10"/></svg><span class="lbl">Leyenda</span></button>
    <button class="ib" data-act="togglePanel" id="ibPanel" title="Mostrar u ocultar el panel lateral (tecla P)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M10 2.5v11"/></svg><span class="lbl">Panel</span></button>
    <button class="ib" data-act="exportMenu" id="ibExport" title="Exportar imagen, Excel, JSON o CSV" aria-haspopup="menu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 12.5h11"/></svg><span class="lbl">Exportar</span></button>
    <button class="ib" data-act="clearCanvas" id="ibClear" title="Limpiar la vista, la capa activa o el espacio de trabajo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9.5 2.5l4 4-6.5 6.5H3.5v-3.5z"/><path d="M7 5l4 4M7 13h7"/></svg><span class="lbl">Limpiar</span></button>
    <button class="ib" data-act="toggleTheme" id="ibTheme" title="Activar o desactivar el modo oscuro (tecla D)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg><span class="lbl">Modo oscuro</span></button>
  </div>

let DATA = {"cats":["Enumeration","Injection","Evasion","Spying","Internet","Anti-Debugging","Ransomware","Helper"],"apis":[["Accept","Ws2_32.dll",[4],"Accept is used to permit an incoming connection attempt on a socket.","windows/win32/api/winsock2/nf-winsock2-accept","2021-10-30","mr.d0x"],["AdjustTokenPrivileges","Advapi32.dll",[1],"AdjustTokenPrivileges is used to enable or disable specific access privileges. Malware that performs process injection often calls this function to gain additional permissions.","windows/win32/api/securitybaseapi/nf-securitybaseapi-adjusttokenprivileges","2021-10-30","mr.d0x"],["AttachThreadInput","User32.dll",[3],"AttachThreadInput is used to attach the input processing from one thread to another so that the second thread receives input events such as keyboard and mouse events. This function is commonly used by keyloggers.","windows/win32/api/winuser/nf-winuser-attachthreadinput","2021-10-30","mr.d0x"],["Bind","Ws2_32.dll",[4],"Bind is used to associates a local address with a socket.","windows/win32/api/winsock2/nf-winsock2-bind","2021-10-30","mr.d0x"],["BitBlt","Gdi32.dll",[3],"BitBlt is used to copy graphic data from one device to another. Spyware sometimes uses this function to capture screenshots.","windows/win32/api/wingdi/nf-wingdi-bitblt","2021-10-30","mr.d0x"],["BringWindowToTop","User32.dll",[7],"BringWindowToTop is used for bringing the specified window to the top of the Z order.","windows/win32/api/winuser/nf-winuser-bringwindowtotop","2021-10-30","mr.d0x"],["CallNextHookEx","User32.dll",[3],"CallNextHookEx is used within code that is hooking an event set by SetWindowsHookEx. CallNextHookEx calls the next hook in the chain. This function is commonly used by keyloggers.","windows/win32/api/winuser/nf-winuser-callnexthookex","2021-10-30","mr.d0x"],["CallWindowProcA","User32.dll",[7],"CallWindowProcA is used to pass message information to the specified window procedure.","windows/win32/api/winuser/nf-winuser-callwindowproca","2021-11-02","@TalenceSecurity"],["CheckRemoteDebuggerPresent","Kernel32.dll",[5],"CheckRemoteDebuggerPresent is used to check if a debugger is being used. This function is commonly used by malware for anti-debugging techniques.","windows/win32/api/debugapi/nf-debugapi-checkremotedebuggerpresent","2021-10-30","mr.d0x"],["Closesocket","Ws2_32.dll",[4],"Closesocket is used to close an existing socket.","windows/win32/api/winsock/nf-winsock-closesocket","2021-11-02","Paul Melson - @pmelson"],["Connect","Ws2_32.dll",[4],"Connect is used to establish a connection to a specified socket.","windows/win32/api/winsock2/nf-winsock2-connect","2021-10-30","mr.d0x"],["ConnectNamedPipe","Kernel32.dll",[7],"ConnectNamedPipe is used to create a server pipe for interprocess communication that will wait for a client pipe to connect. This function can be used to simplify connectivity to a C2 server.","windows/win32/api/namedpipeapi/nf-namedpipeapi-connectnamedpipe","2021-10-30","mr.d0x"],["ControlService","Advapi32.dll",[7],"ControlService is used to start, stop, modify, or send a signal to a running service. This function is commonly used by malware went it requires interaction with a service for malicious purposes.","windows/win32/api/winsvc/nf-winsvc-controlservice","2021-10-30","mr.d0x"],["ControlServiceExA","Advapi32.dll",[7],"ControlServiceExA is used to start, stop, modify, or send a signal to a running service. This function is commonly used by malware went it requires interaction with a service for malicious purposes.","windows/win32/api/winsvc/nf-winsvc-controlserviceexa","2021-10-30","mr.d0x"],["CopyFile2","Kernel32.dll",[7],"CopyFile2 is used to copy an existing file to a new file.","windows/win32/api/winbase/nf-winbase-copyfile2","2021-10-30","mr.d0x"],["CopyFileA","Kernel32.dll",[7],"CopyFileA is used to copy an existing file to a new file.","windows/win32/api/winbase/nf-winbase-copyfilea","2021-10-30","mr.d0x"],["CopyFileExA","Kernel32.dll",[7],"CopyFileExA is used to copy an existing file to a new file.","windows/win32/api/winbase/nf-winbase-copyfileexa","2021-10-30","mr.d0x"],["CountClipboardFormats","User32.dll",[5],"CountClipboardFormats is used to determine whether victim's clipboard was empty. A kind of Anti-debugging technique to determine if the system could be a sandbox.","windows/win32/api/winuser/nf-winuser-countclipboardformats","2021-12-24","Jorge Testa - https://jorgetesta.tech"],["CreateFile2","Kernel32.dll",[7],"CreateFile2 is used to create a new file or opens an existing file.","windows/win32/api/fileapi/nf-fileapi-createfile2","2021-10-30","mr.d0x"],["CreateFileA","Kernel32.dll",[7],"CreateFileA is used to create a new file or opens an existing file.","windows/win32/api/fileapi/nf-fileapi-createfilea","2021-10-30","mr.d0x"],["CreateFileMappingA","Kernel32.dll",[1,2],"CreateFileMappingA creates a handle to a file mapping that loads a file into memory and makes it accessible via memory addresses. Launchers, loaders, and injectors use this function to read and modify PE files.","windows/win32/api/winbase/nf-winbase-createfilemappinga","2021-10-30","mr.d0x"],["CreateMutexA","Kernel32.dll",[7],"CreateMutexA is used to create a new mutex object. Mutexs are often used by malware to prevent the reinfection of a system with the same or different malware variant.","windows/win32/api/synchapi/nf-synchapi-createmutexa","2021-10-30","mr.d0x"],["CreateMutexExA","Kernel32.dll",[7],"CreateMutexExA is used to create a new mutex object. Mutexs are often used by malware to prevent the reinfection of a system with the same or different malware variant.","windows/win32/api/synchapi/nf-synchapi-createmutexexa","2021-10-30","mr.d0x"],["CreatePipe","Kernel32.dll",[7],"CreatePipe is used to create an anonymous pipe and returns handles to the read and write ends of the pipe. Could be used to add a sub-process for execution via cmd.","windows/win32/api/namedpipeapi/nf-namedpipeapi-createpipe","2021-11-02","@TalenceSecurity"],["CreateProcessA","Kernel32.dll",[1],"CreateProcessA is used to create a process. This function is used by malware in several process injection attacks such as process hollowing.","windows/win32/api/processthreadsapi/nf-processthreadsapi-createprocessa","2021-10-30","mr.d0x"],["CreateProcessAsUserA","Advapi32.dll",[1],"CreateProcessAsUserA is used to create a new process and its primary thread.","windows/win32/api/processthreadsapi/nf-processthreadsapi-createprocessasusera","2021-10-30","mr.d0x"],["CreateProcessInternal","Kernel32.dll",[1,2],"CreateProcessInternal is an undocumented API for process creation. According to Windows Internals, CreateProcess and CreateProcessAsUser actually lead to this API, which is responsible for starting the process creation in user land. Eventually it calls NtCreateUserProcess for the kernel land operations. This API is commonly used for spawning a suspended process to be hollowed/injected.","https://medium.com/@Achilles8284/the-birth-of-a-process-part-1-bfb4fdac070e","2022-03-27","InfoSecDodo - @dodo_sec"],["CreateProcessWithTokenW","Advapi32.dll",[1],"CreateProcessWithTokenW is used to create a new process and its primary thread.","windows/win32/api/winbase/nf-winbase-createprocesswithtokenw","2021-10-30","mr.d0x"],["CreateRemoteThread","Kernel32.dll",[1],"CreateRemoteThread is used to create a thread that runs in the virtual address space of another process.","windows/win32/api/processthreadsapi/nf-processthreadsapi-createremotethread","2021-10-30","mr.d0x"],["CreateRemoteThreadEx","Kernel32.dll",[1],"CreateRemoteThreadEx is used to create a thread that runs in the virtual address space of another process.","windows/win32/api/processthreadsapi/nf-processthreadsapi-createremotethreadex","2021-10-30","mr.d0x"],["CreateServiceA","Advapi32.dll",[7],"CreateServiceA is used to create a service object and adds it to the specified service control manager database. This function is commonly used by malware for persistence.","windows/win32/api/winsvc/nf-winsvc-createservicea","2021-10-30","mr.d0x"],["CreateThread","Kernel32.dll",[1],"CreateThread is used to create a thread to execute within the virtual address space of the calling process. This function is commonly used for shellcode execution.","windows/win32/api/processthreadsapi/nf-processthreadsapi-createthread","2021-10-30","mr.d0x"],["CreateTimerQueueTimer","Kernel32.dll",[2],"CreateTimerQueueTimer is used to create a timer-queue timer. This function is commonly used by malware for time-based evasion.","windows/win32/api/threadpoollegacyapiset/nf-threadpoollegacyapiset-createtimerqueuetimer","2021-11-01","mr.d0x"],["CreateToolhelp32Snapshot","Kernel32.dll",[0,5],"CreateToolhelp32Snapshot is used to enumerate processes, threads, and modules. This function is commonly used by malware to enumerate processes before process injection.","windows/win32/api/tlhelp32/nf-tlhelp32-createtoolhelp32snapshot","2021-10-30","mr.d0x"],["CreateWaitableTimer","Kernel32.dll",[2],"CreateWaitableTimer is used to create a delay timer. This function is used by malware for time-based evasion.","windows/win32/api/synchapi/nf-synchapi-createwaitabletimerw","2021-11-01","mr.d0x"],["CreateWindowExA","User32.dll",[2],"CreateWindowExA is used to create an overlapped, pop-up, or child window with an extended window style. This function is commonly used by malware to create invisible windows or for evasion purposes.","windows/win32/api/winuser/nf-winuser-createwindowexa","2021-10-30","mr.d0x"],["CryptAcquireContextA","Advapi32.dll",[6],"CryptAcquireContextA is used to acquire a handle to a particular key container within a particular cryptographic service provider (CSP)","windows/win32/api/wincrypt/nf-wincrypt-cryptacquirecontexta","2021-10-30","mr.d0x"],["CryptBinaryToString","Crypt32.dll",[6],"The CryptBinaryToString function is used to convert an array of bytes into a formatted string.","windows/win32/api/wincrypt/nf-wincrypt-cryptbinarytostringa","2021-12-24","mr.d0x"],["CryptCreateHash","Advapi32.dll",[6],"CryptCreateHash is used to create a hash.","windows/win32/api/wincrypt/nf-wincrypt-cryptcreatehash","2021-10-30","mr.d0x"],["CryptDecrypt","Advapi32.dll",[6],"CryptDecrypt is used to decrypt data.","windows/win32/api/wincrypt/nf-wincrypt-cryptdecrypt","2021-10-30","mr.d0x"],["CryptDeriveKey","Advapi32.dll",[6],"CryptDeriveKey is used to create encryption keys.","windows/win32/api/wincrypt/nf-wincrypt-cryptderivekey","2021-10-30","mr.d0x"],["CryptDestroyHash","Crypt32.dll",[6],"The CryptDestroyHash function destroys the hash object referenced by the hHash parameter. After a hash object has been destroyed, it can no longer be used.","windows/win32/api/wincrypt/nf-wincrypt-cryptdestroyhash","2021-12-24","mr.d0x"],["CryptDestroyKey","Advapi32.dll",[6],"CryptDestroyKey is used to destroy previously generated encryption keys.","windows/win32/api/wincrypt/nf-wincrypt-cryptdestroykey","2021-10-30","mr.d0x"],["CryptEncrypt","Advapi32.dll",[6],"CryptEncrypt is used to encrypt data.","windows/win32/api/wincrypt/nf-wincrypt-cryptencrypt","2021-10-30","mr.d0x"],["CryptGenRandom","Advapi32.dll",[6],"CryptGenRandom is used to fill a buffer with cryptographically random bytes.","windows/win32/api/wincrypt/nf-wincrypt-cryptgenrandom","2021-10-30","mr.d0x"],["CryptGetHashParam","Advapi32.dll",[6],"CryptGetHashParam","windows/win32/api/wincrypt/nf-wincrypt-cryptgethashparam","2021-10-30","mr.d0x"],["CryptHashData","Advapi32.dll",[6],"CryptHashData is used to create a hash.","windows/win32/api/wincrypt/nf-wincrypt-crypthashdata","2021-10-30","mr.d0x"],["CryptProtectData","Crypt32.dll",[2,6],"CryptProtectData can be leveraged to create a malicious artifact for encrypting the file system (Ransomware), effectively evading typical detection methods. More information is available: https://github.com/CarlosG13/Data-Protection-API-DPAPI-For-Impact---Ransomware","https://learn.microsoft.com/en-us/windows/win32/api/dpapi/nf-dpapi-cryptprotectdata","2023-11-19","Carlos David Garrido León"],["CryptReleaseContext","Crypt32.dll",[6],"The CryptReleaseContext function is used to release the handle of a cryptographic service provider (CSP) and a key container.","windows/win32/api/wincrypt/nf-wincrypt-cryptreleasecontext","2021-12-24","mr.d0x"],["CryptSetKeyParam","Advapi32.dll",[6],"CryptSetKeyParam is used to customize various aspects of a session key's operations.","windows/win32/api/wincrypt/nf-wincrypt-cryptsetkeyparam","2021-10-30","mr.d0x"],["CryptStringToBinary","Crypt32.dll",[6],"The CryptStringToBinary function is used to convert a formatted string into an array of bytes.","windows/win32/api/wincrypt/nf-wincrypt-cryptstringtobinarya","2021-12-24","mr.d0x"],["DebugActiveProcessStop","Kernel32.dll",[1],"DebugActiveProcessStop stops the debugger from debugging the specified process.","https://github.com/CarlosG13/Process-Hypnosis-Debugger-assisted-control-flow-hijack","2024-03-13","@H0udini_13"],["DecryptFileA","Advapi32.dll",[6],"DecryptFileA is used to decrypt an encrypted file or directory.","windows/win32/api/winbase/nf-winbase-decryptfilea","2021-10-30","mr.d0x"],["DeleteFileA","Kernel32.dll",[2],"DeleteFileA is used to delete an existing file. This function is used by malware to hide its tracks or tamper with an application.","windows/win32/api/fileapi/nf-fileapi-deletefilea","2021-10-30","mr.d0x"],["DeleteService","Advapi32.dll",[7],"DeleteService is used to mark the specified service for deletion from the service control manager database.","windows/win32/api/winsvc/nf-winsvc-deleteservice","2021-10-30","mr.d0x"],["DeviceIoControl","Kernel32.dll",[7],"DeviceIoControl is used to send a control message from user space to a device driver. DeviceIoControl is popular with kernel malware because it is an easy, flexible way to pass information between user space and kernel space.","windows/win32/api/ioapiset/nf-ioapiset-deviceiocontrol","2021-10-30","mr.d0x"],["DnsQuery_A","Dnsapi.dll",[4],"DnsQuery_A is used to send a DNS query. This may be used for communications over a DNS tunnel.","windows/win32/api/windns/nf-windns-dnsquery_a","2021-11-01","Eran Zimmerman Gonen - @3r4nz"],["DnsQueryEx","Dnsapi.dll",[4],"DnsQueryEx is used to send a DNS query. This may be used for communications over a DNS tunnel.","windows/win32/api/windns/nf-windns-dnsqueryex","2021-11-01","Eran Zimmerman Gonen - @3r4nz"],["DrawTextExA","User32.dll",[7],"DrawTextExA is used to draw formatted text in the specified rectangle. This function has been used by ransomware for writing ransom notes.","windows/win32/api/winuser/nf-winuser-drawtextexa","2021-10-30","mr.d0x"],["DuplicateToken","Advapi32.dll",[1,2],"The DuplicateToken function creates a new access token that duplicates one already in existence.","windows/win32/api/securitybaseapi/nf-securitybaseapi-duplicatetoken","2021-11-11","@TalenceSecurity"],["EncryptFileA","Advapi32.dll",[6],"EncryptFileA is used to encrypt a file or directory.","windows/win32/api/winbase/nf-winbase-encryptfilea","2021-10-30","mr.d0x"],["EnumDesktopWindows","User32.dll",[0],"EnumDesktopWindows is used to enumerate all top-level windows associated with the specified desktop. This function is commonly used for enumeration purposes.","windows/win32/api/winuser/nf-winuser-enumdesktopwindows","2021-10-30","mr.d0x"],["EnumDeviceDrivers","Kernel32.dll",[0],"EnumDeviceDrivers is used to enumerate drivers in the machine. This function is commonly used with kernel malware or for enumeration purposes.","windows/win32/api/psapi/nf-psapi-enumdevicedrivers","2021-10-30","mr.d0x"],["EnumProcesses","Kernel32.dll",[0],"EnumProcesses is used to enumerate processes in the machine. Process enumeration is often a precursor to process injection.","windows/win32/api/psapi/nf-psapi-enumprocesses","2021-10-30","mr.d0x"],["EnumProcessModules","Kernel32.dll",[0],"EnumProcessModules is used to enumerate the loaded modules (executables and DLLs) for a given process. Malware enumerates through modules when doing injection.","windows/win32/api/psapi/nf-psapi-enumprocessmodules","2021-10-30","mr.d0x"],["EnumProcessModulesEx","Kernel32.dll",[0],"EnumProcessModulesEx is used to enumerate the loaded modules (executables and DLLs) for a given process. Malware enumerates through modules when doing injection.","windows/win32/api/psapi/nf-psapi-enumprocessmodulesex","2021-10-30","mr.d0x"],["EnumResourceTypesA","Kernel32.dll",[0],"EnumResourceTypesA is used to enumerate resource types within a binary module. Starting with Windows Vista, this is typically a language-neutral Portable Executable (LN file), and the enumeration also includes resources from one of the corresponding language-specific resource files (.mui files)—if one exists—that contain localizable language resources. It is also possible to use hModule to specify a .mui file, in which case only that file is searched for resource types. Alternately, applications can call EnumResourceTypesEx, which provides more precise control over which resource files to enumerate.","windows/win32/api/winbase/nf-winbase-enumresourcetypesa","2021-11-02","@TalenceSecurity"],["EnumResourceTypesExA","Kernel32.dll",[0],"EnumResourceTypesExA is used to enumerate resource types associated with a specified binary module. The search can include both a language-neutral Portable Executable file (LN file) and its associated .mui files. Alternately, it can be limited to a single binary module of any type, or to the .mui files associated with a single LN file. The search can also be limited to a single associated .mui file that contains resources for a specific language.","windows/win32/api/libloaderapi/nf-libloaderapi-enumresourcetypesexw","2021-11-02","@TalenceSecurity"],["EnumSystemLocalesA","Kernel32.dll",[0,1,2,6],"EnumSystemLocalesA is used enumerate installed locale identifiers, all of the supported identifiers or alternate sort identifiers, according to which flag is passed to the API. Can be used to geofence infection campaigns or avoid infecting systems f function baseName(n){
  let s=String(n).replace(/^__imp_?/i,"").replace(/^_+/,"").replace(/@\d+$/,"");
  s=s.replace(/_(A|W)$/,"");
  if(/[a-z0-9](A|W)$/.test(s)) s=s.slice(0,-1);
  s=s.toLowerCase();
  if(s.startsWith("zw")) s="nt"+s.slice(2);
  return s;
}
function matchApi(tok){
  const t=String(tok).replace(/^__imp_?/i,"").replace(/^_+/,"").replace(/@\d+$/,"");

}

function loadCatalog(d){
  if(!d||!Array.isArray(d.cats)||!Array.isArray(d.apis)) throw Error("Catálogo inválido");
  DATA=d; CATS=d.cats;
  API=d.apis.map(([name,dll,cats,desc,doc,created,credit],i)=>({
    i,name:String(name),dll:String(dll||""),cats:(cats||[]).filter(c=>c>=0&&c<CATS.length),desc:String(desc||""),created:String(created||""),credit:String(credit||""),key:String(name).toLowerCase(),
    doc: doc ? (String(doc).startsWith("http") ? String(doc) : "https://docs.microsoft.com/en-us/"+doc) : "",
    malapi: "https://malapi.io/winapi/"+encodeURIComponent(name)
  }));
  BY_NAME=new Map(API.map(a=>[a.name,a])); BY_KEY=new Map(API.map(a=>[a.key,a]));
  BY_BASE=new Map(); for(const a of API){const b=baseName(a.name); if(!BY_BASE.has(b)) BY_BASE.set(b,a);}
  const m=new Map(); for(const a of API){const k=dllKey(a.dll); if(!k) continue; if(!m.has(k)) m.set(k,{k,label:a.dll.replace(/\.(dll|lib)$/i,""),n:0}); m.get(k).n++;}
  DLLS=[...m.values()].sort((x,y)=>y.n-x.n);
}

function hexRgb(h){h=String(h).replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255];}
function rgbHex(r){return "#"+r.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");}
function mix(a,b,t){const x=hexRgb(a),y=hexRgb(b); return rgbHex(x.map((v,i)=>v+(y[i]-v)*t));}
function gradColor(g,v){
  const lo=Number(g.min), hi=Number(g.max);
  let t = hi===lo ? 1 : (v-lo)/(hi-lo); t=Math.max(0,Math.min(1,t));
  const c=g.colors; return t<=.5 ? mix(c[0],c[1],t*2) : mix(c[1],c[2],(t-.5)*2);
}
function textOn(hex){const [r,g,b]=hexRgb(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return (0.2126*r+0.7152*g+0.0722*b)>0.4?"#1b1f24":"#ffffff";}

let S = defaultState();

let UNDO=null;
const L = () => S.layers[S.activeId];

/* ---------- persistencia ---------- */
const LS_KEY="malapi-navigator-v1";
const store={mode:"local",db:null,uid:null,dirty:new Set(),del:new Set(),timer:null,busy:false,retries:0,state:"idle"};
function lsSave(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){} }
function lsLoad(){ try{ const t=localStorage.getItem(LS_KEY); return t?JSON.parse(t):null; }catch(e){ return null; } }
function touch(layer){ const now=Date.now(); S.updated=now; if(layer){ layer.updated=now; store.dirty.add(layer.id);} store.dirty.add("ws"); lsSave(); schedule(); }
function schedule(delay=700){ clearTimeout(store.timer); store.timer=setTimeout(flush,delay); if(store.mode==="db"||store.mode==="host"){ store.state="pending"; renderSave(); } }
function wsDoc(){ return {v:1,updated:S.updated,activeId:S.activeId,order:S.order.slice(),weights:Object.assign({},S.weights),prefs:JSON.parse(JSON.stringify(S.prefs))}; }
async function flush(){
  if(store.mode==="host"){ hostSave(); return; }
  if(store.mode!=="db"){ renderSave(); return; }
  if(store.busy){ schedule(400); return; }
  store.busy=true; store.state="saving"; renderSave();
  const col=store.db.collection("data/users/"+store.uid);
  let failed=null;
  try{
    for(const id of [...store.del]){ store.del.delete(id); try{ await col.doc("layer-"+id).delete(); }catch(e){ store.del.add(id); throw e; } }
    for(const w of [...store.dirty]){
      store.dirty.delete(w);
      try{
        if(w==="ws") await col.doc("workspace").set(wsDoc());
        else if(S.layers[w]) await col.doc("layer-"+w).set(JSON.parse(JSON.stringify(S.layers[w])));
      }catch(e){ store.dirty.add(w); throw e; }
    }
    store.retries=0;
  }catch(e){ failed=e; }
  store.busy=false;
  if(failed){
    const code=failed&&failed.code;
    if(code==="unavailable"||code==="resource_exhausted"){ if(store.retries++<4){ store.state="pending"; renderSave(); schedule(2500*store.retries); return; } }
    if(code==="invalid_argument"||code==="revoked"||code==="not_granted"){ store.mode="local"; }
    store.state="error"; renderSave(); return;
  }
  store.state=(store.dirty.size||store.del.size)?"pending":"ok"; renderSave();
  if(store.dirty.size||store.del.size) schedule(300);
}
function renderSave(){
  const el=$("#saveState"); el.classList.toggle("err",store.state==="error");
  if(store.mode==="host"){
    el.textContent = store.state==="pending" ? "Guardando…" : "Guardado en disco";
    el.title = HOST.savePath?"Archivo: "+HOST.savePath:""; return;
  }
  if(store.mode==="db"){
    el.textContent = store.state==="saving"||store.state==="pending" ? "Guardando…" : store.state==="error" ? "No se pudo guardar; los cambios siguen en este navegador" : "Guardado en tu espacio privado";
  } else {
    el.textContent = store.state==="error" ? "Sin almacenamiento remoto: se guarda en este navegador" : "Guardado en este navegador";
  }
}
async function initRemote(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  let db=null,user=null;
  try{ [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]); }catch(e){ return; }
  if(!db||!user) return;
  let uid=null; try{ uid=await user.id(); }catch(e){}
  if(!uid) return;
  store.db=db; store.uid=uid;
  try{
    const snap=await db.collection("data/users/"+uid).get();
    let ws=null; const layers={};
    for(const d of snap.docs){ const b=d.data(); if(!b) continue; if(d.id==="workspace") ws=b; else if(d.id.startsWith("layer-")) layers[d.id.slice(6)]=b; }
    store.mode="db";
    if(ws && (Number(ws.updated)||0) >= (S.updated||0)){
      const merged=sanitizeState(Object.assign({},ws,{layers}));
      if(merged){ S=merged; UI.sel.clear(); lsSave(); renderAll(); }
      store.state="ok"; renderSave();
    } else {
      for(const id of S.order) store.dirty.add(id); store.dirty.add("ws");
      const stale=Object.keys(layers).filter(id=>!S.layers[id]); for(const id of stale) store.del.add(id);
      flush();
    }
  }catch(e){ store.mode="local"; store.state="error"; renderSave(); }
}


/* ---------- integración con Streamlit (componente bidireccional) ---------- */
const HOST={savePath:"",lastNonce:null,rev:0,auto:true,fixed:900,lastH:0,resizeBound:false};
function hostFit(){
  let h=HOST.fixed;
  if(HOST.auto){
    try{ const fe=window.frameElement;
      if(fe){ const top=Math.max(0,fe.getBoundingClientRect().top); h=Math.floor(window.parent.innerHeight-top-12); }
    }catch(e){ h=HOST.fixed; }
    h=Math.max(480,h);
  }
  if(Math.abs(h-HOST.lastH)>2){ HOST.lastH=h; hostPost("streamlit:setFrameHeight",{height:h}); }
}
function hostPost(type,data){ try{ window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},data||{}),"*"); }catch(e){} }
function hostSave(){
  store.dirty.clear(); store.del.clear();
  hostPost("streamlit:setComponentValue",{dataType:"json",value:{rev:Date.now()+"."+(++HOST.rev),ack:HOST.lastNonce,workspace:JSON.parse(JSON.stringify(S))}});
  store.state="ok"; renderSave();
}
let booted=false;
function bootLocal(){ if(booted) return; booted=true; const saved=sanitizeState(lsLoad()); if(saved) S=saved; renderAll(); initRemote(); }
function onHostRender(args){
  const reqH=Number(args.height)||0;
  HOST.auto = reqH<=0; if(reqH>0) HOST.fixed=reqH;
  if(!HOST.resizeBound){ HOST.resizeBound=true; let tm=null;
    try{ window.parent.addEventListener("resize",()=>{ clearTimeout(tm); tm=setTimeout(hostFit,120); }); }catch(e){} }
  hostFit();
  if(store.mode!=="host"){
    store.mode="host"; booted=true; HOST.savePath=String(args.save_label||"");
    if(args.catalog){ try{ loadCatalog(args.catalog); }catch(e){ toast("El catálogo recibido no es válido; se usa el integrado"); } }
    const ws=sanitizeState(args.workspace);
    S = ws || defaultState(); UI.sel.clear(); UI.dll="";
    renderAll(); if(!ws) touch(null); else { store.state="ok"; renderSave(); }
  }
  const p=args.pending;
  if(p&&p.nonce&&p.nonce!==HOST.lastNonce){ HOST.lastNonce=p.nonce; openImport(p); hostSave(); }
}
function startHost(){
  if(window.claude||window.parent===window) return false;
  window.addEventListener("message",e=>{ const d=e.data; if(d&&d.type==="streamlit:render") onHostRender(d.args||{}); });
  hostPost("streamlit:componentReady",{apiVersion:1});
  return true;
}

/* ---------- ediciones ---------- */
function setEntry(layer,name,patch){
  const e=Object.assign({},layer.entries[name]||{});
  for(const [k,v] of Object.entries(patch)){ if(v===null||v===""||v===undefined||(typeof v==="number"&&!isFinite(v))) delete e[k]; else e[k]=v; }
  if(Object.keys(e).length) layer.entries[name]=e; else delete layer.entries[name];
}

}
function addLayer(layer,activate=true){ S.layers[layer.id]=layer; S.order.push(layer.id); if(activate) S.activeId=layer.id; touch(layer); }
function deleteLayer(id){
  if(S.order.length<=1) return;
  delete S.layers[id]; S.order=S.order.filter(x=>x!==id); if(S.activeId===id) S.activeId=S.order[Math.max(0,S.order.length-1)];

function fitGradient(layer){

  if(!vals.length) return;

function sortItems(items,layer){
  const sc=a=>{const e=layer.entries[a.name]; return hasScore(e)?e.s:(e&&e.c?-1e-9:-Infinity);};
  const by={
    score:(x,y)=>(sc(y)-sc(x))||(apiWeight(y)-apiWeight(x))||(y.cats.length-x.cats.length)||x.name.localeCompare(y.name),
    weight:(x,y)=>(apiWeight(y)-apiWeight(x))||(y.cats.length-x.cats.length)||(sc(y)-sc(x))||x.name.localeCompare(y.name),
    name:(x,y)=>x.name.localeCompare(y.name),
    dll:(x,y)=>x.dll.localeCompare(y.dll)||x.name.localeCompare(y.name)
  }[S.prefs.sort]||((x,y)=>x.name.localeCompare(y.name));

    if(UI.dll) items=items.filter(a=>dllKey(a.dll)===UI.dll);

}

function evalPatterns(markedSet){
  const res=[];
  for(const p of PATTERNS){
    if(p.any){
      const hit=p.any.filter(n=>markedSet.has(n));
      if(hit.length>=p.k) res.push({p,full:true,hit,missing:[]});
      else if(hit.length>0 && hit.length>=p.k-1) res.push({p,full:false,hit,missing:[`${p.k-hit.length} más de: ${p.any.filter(n=>!markedSet.has(n)).slice(0,5).join(", ")}`]});
      continue;
    }
    const hit=[],missing=[];
    for(const grp of p.g){ const h=grp.filter(n=>markedSet.has(n)); if(h.length) hit.push(...h); else missing.push(grp.join(" o ")); }
    const got=p.g.length-missing.length;
    if(!missing.length) res.push({p,full:true,hit:[...new Set(hit)],missing});
    else if(got>=Math.ceil(p.g.length/2) && got>=1 && p.g.length>2) res.push({p,full:false,hit:[...new Set(hit)],missing});
  }
  return res.sort((a,b)=>(b.full-a.full)||(Number(DEFAULT_WEIGHTS[b.p.cat]||0)-Number(DEFAULT_WEIGHTS[a.p.cat]||0)));
}

/* ---------- importar APIs del binario ---------- */
function parseImports(text){
  const found=new Map(); const unmatched=new Set();
  for(const raw of String(text).split(/\r?\n/)){
    const line=raw.trim(); if(!line||line.startsWith("#")) continue;
    const toks=line.split(/[\s,;|"'`()\[\]{}<>=:]+/).filter(Boolean);
    const lineHits=[];
    for(let t of toks){
      if(t.includes("!")) t=t.split("!").pop();
      if(/\.(dll|exe|sys|drv|ocx|lib|cpl)$/i.test(t)) continue;
      if(t.includes(".")) t=t.split(".").pop();
      t=t.replace(/^__imp_?/i,"").replace(/^_+/,"").replace(/@\d+$/,"");
      if(!/^[A-Za-z][A-Za-z0-9_]{2,}$/.test(t)) continue;
      const a=matchApi(t);
      if(a){ lineHits.push(a); if(!found.has(a.name)) found.set(a.name,{a,as:new Set(),score:null}); if(t!==a.name) found.get(a.name).as.add(t); }
      else if(/^[A-Z][A-Za-z0-9_]{3,}$/.test(t)&&/[a-z]/.test(t)&&/[A-Z][a-z0-9]+[A-Z]/.test(t)) unmatched.add(t);
    }
    const last=toks[toks.length-1];
    if(lineHits.length===1 && toks.length>=2 && /^-?\d+([.,]\d+)?$/.test(last)) found.get(lineHits[0].name).score=parseFloat(last.replace(",","."));
  }
  return {found,unmatched:[...unmatched].sort()};
}

/* ---------- superposición ---------- */
function compileExpr(src){
  const toks=[]; let i=0; const s=String(src);
  while(i<s.length){ const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9.]/.test(c)){let j=i; while(j<s.length&&/[0-9.]/.test(s[j])) j++; const v=Number(s.slice(i,j)); if(isNaN(v)) throw Error("Número inválido: "+s.slice(i,j)); toks.push({t:"n",v}); i=j; continue;}
    if(/[A-Za-z_]/.test(c)){let j=i; while(j<s.length&&/[A-Za-z0-9_]/.test(s[j])) j++; toks.push({t:"id",v:s.slice(i,j).toLowerCase()}); i=j; continue;}
    const two=s.slice(i,i+2);
    if(["&&","||","==","!=",">=","<="].includes(two)){toks.push({t:"op",v:two}); i+=2; continue;}
    if("+-*/%()<>!?:,".includes(c)){toks.push({t:"op",v:c}); i++; continue;}
    throw Error(`Carácter no válido: “${c}”`);
  }
  let p=0; const vars=new Set();
  const peek=()=>toks[p]; const isOp=v=>!!peek()&&peek().t==="op"&&peek().v===v;
  const eat=v=>{ if(!isOp(v)) throw Error(`Se esperaba “${v}”`); p++; };
  const F={max:(...a)=>Math.max(...a),min:(...a)=>Math.min(...a),abs:x=>Math.abs(x),avg:(...a)=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,round:x=>Math.round(x)};
  function ternary(){ const c=or(); if(isOp("?")){ p++; const a=ternary(); eat(":"); const b=ternary(); return e=>c(e)?a(e):b(e);} return c; }
  function or(){ let l=and(); while(isOp("||")){ p++; const r=and(), L0=l; l=e=>(L0(e)||r(e))?1:0; } return l; }
  function and(){ let l=cmp(); while(isOp("&&")){ p++; const r=cmp(), L0=l; l=e=>(L0(e)&&r(e))?1:0; } return l; }
  function cmp(){ let l=add(); const t=peek(); if(t&&t.t==="op"&&["==","!=",">=","<=",">","<"].includes(t.v)){ p++; const r=add(), L0=l, o=t.v;
      l=e=>{const x=L0(e),y=r(e); return (o==="=="?x===y:o==="!="?x!==y:o===">="?x>=y:o==="<="?x<=y:o===">"?x>y:x<y)?1:0;}; } return l; }
  function add(){ let l=mul(); while(isOp("+")||isOp("-")){ const o=toks[p++].v, r=mul(), L0=l; l=o==="+"?e=>L0(e)+r(e):e=>L0(e)-r(e);} return l; }
  function mul(){ let l=un(); while(isOp("*")||isOp("/")||isOp("%")){ const o=toks[p++].v, r=un(), L0=l;
      l=o==="*"?e=>L0(e)*r(e):o==="/"?e=>{const d=r(e); return d===0?0:L0(e)/d;}:e=>{const d=r(e); return d===0?0:L0(e)%d;}; } return l; }
  function un(){ if(isOp("-")){ p++; const x=un(); return e=>-x(e);} if(isOp("!")){ p++; const x=un(); return e=>x(e)?0:1;} return prim(); }
  function prim(){ const t=peek(); if(!t) throw Error("La expresión termina antes de tiempo");
    if(t.t==="n"){ p++; const v=t.v; return ()=>v; }
    if(t.t==="id"){ p++;
      if(isOp("(")){ const f=F[t.v]; if(!f) throw Error(`Función desconocida: ${t.v}`); p++; const args=[];
        if(!isOp(")")){ args.push(ternary()); while(isOp(",")){ p++; args.push(ternary()); } } eat(")"); return e=>f(...args.map(a=>a(e))); }
      if(t.v.length!==1) throw Error(`Variable desconocida: ${t.v}`); const k=t.v; vars.add(k); return e=>e[k]??0; }
    if(isOp("(")){ p++; const x=ternary(); eat(")"); return x; }
    throw Error(`Símbolo inesperado: “${t.v}”`);
  }
  if(!toks.length) throw Error("Escribí una expresión");
  const fn=ternary(); if(p<toks.length) throw Error(`Sobra: “${toks[p].v}”`);
  return {fn,vars};
}
/* Motor puro: evalúa la receta sobre las 370 APIs del catálogo. */
function overlayCompute(r){
  if(!r.sources.length) return {error:"Marcá al menos una capa."};
  const gone=r.sources.filter(([,id])=>!S.layers[id]);
  if(gone.length) return {error:`Falta ${gone.length===1?"la capa de origen":"capas de origen"} ${gone.map(([k])=>k).join(", ")}: se eliminó después de crear la superposición.`};
  let comp; try{ comp=compileExpr(r.expr); }catch(e){ return {error:e.message}; }
  const known=new Set(r.sources.map(x=>x[0])); const bad=[...comp.vars].filter(v=>!known.has(v));
  if(bad.length) return {error:`La expresión usa ${bad.join(", ")}, pero solo hay capas asignadas a ${[...known].join(", ")}.`};
  const co=Number(r.colorOnly); const colorOnly=isFinite(co)?co:1;
  const val=e=> hasScore(e) ? e.s : (e&&e.c ? colorOnly : 0);
  const entries={}; let lo=Infinity,hi=-Infinity;
  for(const a of API){
    const n=a.name; const env={};
    for(const [k,id] of r.sources) env[k]=val(S.layers[id].entries[n]);
    let v=comp.fn(env); if(typeof v!=="number"||!isFinite(v)) v=0; v=Math.round(v*100)/100;
    if(v===0) continue;
    const e={s:v}; lo=Math.min(lo,v); hi=Math.max(hi,v);
    if(r.colorFrom&&S.layers[r.colorFrom]){ const ce=S.layers[r.colorFrom].entries[n]; if(ce&&ce.c) e.c=ce.c; }
    if(r.comments){ const ms=r.sources.map(([,id])=>{const x=S.layers[id].entries[n]; return x&&x.m?`[${S.layers[id].name}] ${x.m}`:"";}).filter(Boolean); if(ms.length) e.m=ms.join("\n"); }
    entries[n]=e;
  }
  return {entries,lo,hi,count:Object.keys(entries).length};
}
function applyOverlayResult(layer,r,res){
  layer.entries=res.entries;
  layer.recipe=JSON.parse(JSON.stringify(r));
  layer.desc=`Superposición: ${r.sources.map(([k,id])=>`${k} = ${S.layers[id].name}`).join("; ")}. Expresión: ${r.expr}.`+(r.colorOnly!==0?` APIs marcadas solo con color valen ${r.colorOnly}.`:"");
  const vals=Object.values(res.entries).map(e=>e.s);
  if(vals.length){ layer.gradient.min=Math.min(0,...vals); layer.gradient.max=Math.max(...vals); if(layer.gradient.max===layer.gradient.min) layer.gradient.max=layer.gradient.min+1; }
  layer.unmatched=[...new Set(r.sources.flatMap(([,id])=>S.layers[id].unmatched||[]))].sort();
  if(r.colorFrom&&S.layers[r.colorFrom]) layer.legend=legendItemsOf(S.layers[r.colorFrom]).map(x=>({...x}));
}

  const res=overlayCompute(layer.recipe);

}

let dlPromise=null;
async function saveFile(filename,text,mime){
  const isBlob = text instanceof Blob;
  if(!dlPromise) dlPromise = (window.claude&&typeof window.claude.use==="function") ? window.claude.use("downloads").catch(()=>null) : Promise.resolve(null);

  if(dl){ try{ const r=await dl.save({filename,data:isBlob?text:new Blob([text],{type:mime})}); if(r&&r.status==="saved") toast("Archivo exportado"); return; }
    catch(e){ const c=e&&e.code; if(c==="declined") return; if(c==="rate_limited"){ toast("Ya hay una descarga pendiente de confirmación"); return; }
      if(c==="extension_not_enabled"||c==="rejected_extension"){ toast(`Esta vista no permite descargar archivos .${filename.split(".").pop()}`); if(isBlob) return; } } }
  if(!window.claude){
    try{ const url=URL.createObjectURL(isBlob?text:new Blob([text],{type:mime})); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast(`Descargado: ${filename}`); return; }catch(e){}
  }
  if(isBlob){ toast("La descarga directa no está disponible en esta vista"); return; }
  modal(`Exportar ${filename}`,`<p class="hint" style="margin-top:0">La descarga directa no está disponible en esta vista. Copiá el contenido y guardalo como <b>${esc(filename)}</b>.</p><textarea class="big" id="expTxt" readonly>${esc(text)}</textarea>`,

}

  for(const a of list){ const e=l.entries[a.name]; rows.push([q(a.name),q(a.dll),q(a.cats.map(i=>CATS[i]).join(" | ")),apiWeight(a),hasScore(e)?e.s:"",q(e.c||""),q(e.m||"")].join(",")); }

function importJsonText(text){
  let j; try{ j=JSON.parse(text); }catch(e){ toast("El archivo no es un JSON válido"); return; }
  const list = Array.isArray(j) ? j : j.format==="malapi-workspace" ? (j.layers||[]) : [j];
  let n=0,first=null;
  for(const x of list){

    const l=newLayer(String(x.name||"Capa importada").slice(0,80),{source:"json"}); l.desc=String(x.description||x.desc||"");
    if(x.sample) l.sample={name:String(x.sample.name||""),hash:String(x.sample.hash||"")};
    const g=x.gradient; if(g){ const cols=Array.isArray(g.colors)?g.colors.map(c=>String(c).slice(0,7)).filter(c=>/^#[0-9a-f]{6}$/i.test(c)):[];
      if(cols.length>=3) l.gradient.colors=[cols[0],cols[Math.floor(cols.length/2)],cols[cols.length-1]]; else if(cols.length===2) l.gradient.colors=[cols[0],mix(cols[0],cols[1],.5),cols[1]];
      const mn=g.min??g.minValue, mx=g.max??g.maxValue; if(isFinite(+mn)) l.gradient.min=+mn; if(isFinite(+mx)) l.gradient.max=+mx; }
    const items = Array.isArray(x.entries) ? x.entries.map(e=>({id:e.api,s:e.score,c:e.color,m:e.comment}))
      : Array.isArray(x.techniques) ? x.techniques.map(t=>({id:t.techniqueID||t.api,s:t.score,c:t.color,m:t.comment}))
      : (x.entries&&typeof x.entries==="object") ? Object.entries(x.entries).map(([k,v])=>({id:k,s:v.s,c:v.c,m:v.m})) : [];
    const miss=[];
    for(const it of items){ const a=it.id&&matchApi(String(it.id)); if(!a){ if(it.id) miss.push(String(it.id)); continue; }
      const c=typeof it.c==="string"&&/^#[0-9a-f]{6}/i.test(it.c)?it.c.slice(0,7):null;
      setEntry(l,a.name,{s:(typeof it.s==="number"&&isFinite(it.s))?it.s:(it.s!==""&&it.s!=null&&isFinite(+it.s)?+it.s:null),c,m:it.m?String(it.m).slice(0,4000):null}); }

    addLayer(l,!first); if(!first) first=l; n++;
  }
  if(!n){ toast("No se reconoció ninguna capa en el archivo"); return; }
  S.activeId=first.id; UI.sel.clear(); renderAll(); toast(n===1?`Capa “${first.name}” importada`:`${n} capas importadas`);
}

function snapshot(label){ UNDO={label,state:JSON.parse(JSON.stringify(S))}; }
function undo(){
  if(!UNDO) return; const snap=UNDO; UNDO=null;
  const restored=sanitizeState(snap.state); if(!restored) return;
  const before=new Set(S.order);
  S=restored; S.updated=Date.now();
  for(const id of before) if(!S.layers[id]){ store.dirty.delete(id); store.del.add(id); }
  for(const id of S.order){ store.del.delete(id); store.dirty.add(id); }
  UI.sel.clear(); touch(null); renderAll(); toast(`Se deshizo: ${snap.label}`);
}
function clearView(){

      +`<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
      +`<sheetFormatPr defaultRowHeight="15"/>${cols?`<cols>${cols}</cols>`:""}<sheetData>${rows}</sheetData></worksheet>`;
  };
  // los estilos se registran al construir las filas; por eso se generan las hojas antes que styles.xml
  const built=sheets.map(sh=>({name:sh.name,xml:sheetXml({rows:sh.build(style),widths:sh.widths})}));
  const argb=h=>"FF"+h.replace("#","").toUpperCase();
  const border1=`<border><left style="thin"><color rgb="FFB0B7AE"/></left><right style="thin"><color rgb="FFB0B7AE"/></right><top style="thin"><color rgb="FFB0B7AE"/></top><bottom style="thin"><color rgb="FFB0B7AE"/></bottom><diagonal/></border>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
    +`<fonts count="3"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font></fonts>`
    +`<fills count="${3+fills.length}"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="${argb(HEADER_FILL)}"/><bgColor indexed="64"/></patternFill></fill>`
    +fills.map(f=>`<fill><patternFill patternType="solid"><fgColor rgb="${argb(f)}"/><bgColor indexed="64"/></patternFill></fill>`).join("")+`</fills>`
    +`<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${border1}</borders>`
    +`<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`
    +`<cellXfs count="${xfs.length}">`+xfs.map(x=>{
        if(x.header) return `<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/>`;
        return `<xf numFmtId="0" fontId="${x.font}" fillId="${x.fill}" borderId="${x.border}" xfId="0"${x.font?' applyFont="1"':""}${x.fill?' applyFill="1"':""}${x.border?' applyBorder="1"':""}${x.wrap?' applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>':"/>"}`;
      }).join("")+`</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const files=[
    {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${built.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${built.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${built.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${built.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:"xl/styles.xml",data:styles},
    ...built.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:s.xml}))

/* Hojas de una capa: matriz (como Navigator: respeta orden, filtros y ocultos) + detalle. */
function layerSheets(layer,used){
  const cols=columns(layer), vis=new Set(cols.flatMap(c=>c.items.map(a=>a.name)));
  const matrix={name:xlsxSheetName(layer.name,used),widths:cols.map(()=>26),build(style){
    const maxR=Math.max(0,...cols.map(c=>c.items.length)); const rows=[cols.map(c=>({v:c.cat,s:1}))];
    for(let r=0;r<maxR;r++) rows.push(cols.map(c=>{ const a=c.items[r]; if(!a) return null; return {v:a.name,s:style(cellColor(layer,layer.entries[a.name]))}; }));
    return rows; }};
  const ann=API.filter(a=>vis.has(a.name)&&isAnnotated(layer.entries[a.name]))
    .sort((x,y)=>((layer.entries[y.name].s??-Infinity)-(layer.entries[x.name].s??-Infinity))||x.name.localeCompare(y.name));
  const detail={name:xlsxSheetName(layer.name.slice(0,21)+" (detalle)",used),widths:[28,16,30,10,9,11,60],build(style){
    const rows=[["API","DLL","Categorías","Peso","Score","Color","Comentario"].map(v=>({v,s:1}))];
    for(const a of ann){ const e=layer.entries[a.name];
      rows.push([{v:a.name,s:2},{v:a.dll,s:2},{v:a.cats.map(i=>CATS[i]).join(", "),s:2},{v:apiWeight(a),s:2},{v:hasScore(e)?e.s:"",s:2},{v:e.c||"",s:e.c?style(e.c):2},{v:e.m||"",s:3}]); }
    return rows; }};
  return [matrix,detail];
}
function exportXlsx(all){
  const used=new Set(); const layers=all?S.order.map(id=>S.layers[id]):[L()];
  const blob=buildXlsx(layers.flatMap(l=>layerSheets(l,used)));
  return saveFile(all?`malapi-capas-${today()}.xlsx`:`malapi-capa-${slug(L().name)}.xlsx`,blob,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

/* ---------- menú Exportar ---------- */
function closeExportMenu(){ const m=$("#expMenu"); if(m) m.remove(); }

function runExport(kind){

}

/* ---------- leyenda de colores (legend items de Navigator) ---------- */
function legendHTML(l){
  const items=legendItemsOf(l);
  const used=[...new Set(Object.values(l.entries).map(e=>e.c).filter(Boolean))];
  const missing=used.filter(c=>!items.some(it=>it.color.toLowerCase()===c.toLowerCase()));

    <div class="row" style="margin-top:6px"><button class="btn" data-act="lgAdd">Agregar elemento</button>${missing.length?`<button class="btn" data-act="lgUsed">Agregar colores usados (${missing.length})</button>`:""}${items.length?`<button class="btn ghost danger" data-act="lgClear">Limpiar</button>`:""}</div>`;
}

/* ---------- eventos ---------- */
function openPanelMobile(){ $("#panel").classList.add("open"); applyChrome(); }
function selectApi(name,ev,col){
  if(ev&&(ev.ctrlKey||ev.metaKey)){ UI.sel.has(name)?UI.sel.delete(name):UI.sel.add(name); UI.anchor={name,col}; }
  else if(ev&&ev.shiftKey&&UI.anchor&&UI.anchor.col===col&&UI.colLists[col]){
    const list=UI.colLists[col]; const i=list.indexOf(UI.anchor.name), j=list.indexOf(name);
    if(i>=0&&j>=0){ for(let k=Math.min(i,j);k<=Math.max(i,j);k++) UI.sel.add(list[k]); }
  } else { UI.sel=new Set([name]); UI.anchor={name,col}; }
  UI.ptab="sel"; renderMatrix(); renderPanel();
}
document.addEventListener("click",async e=>{
  if($("#expMenu")&&!e.target.closest("#expMenu")&&!e.target.closest("#ibExport")) closeExportMenu();
  const cell=e.target.closest(".cell");
  if(cell){ selectApi(cell.dataset.api,e,+cell.dataset.col); if(!(e.ctrlKey||e.metaKey||e.shiftKey)) openPanelMobile(); return; }
  const tab=e.target.closest("[data-layer]");
  if(tab){ S.activeId=tab.dataset.layer; touch(null); renderTabs(); renderMatrix(); renderPanel(); return; }
  const pt=e.target.closest("[data-ptab]");
  if(pt){ UI.ptab=pt.dataset.ptab; renderPanel(); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const l=L(); const v=b.dataset.v;
  switch(b.dataset.act){
    case "newLayer": openNewLayer(); break;
    case "importApis": openImport(); break;
    case "overlay": openOverlay(); break;
    case "weights": openWeights(); break;
    case "columns": openColumns(); break;
    case "clearSel": UI.sel.clear(); renderMatrix(); renderPanel(); break;
    case "selectHits": { const q=UI.q.trim().toLowerCase(); if(!q) break; UI.sel=new Set(); for(const c of Object.values(UI.colLists)) for(const n of c){ if(matches(BY_NAME.get(n),q)) UI.sel.add(n);} UI.ptab="sel"; renderMatrix(); renderPanel(); openPanelMobile(); break; }
    case "quickScore": applyToSelection({s:v===""?null:+v}); renderPanel(); break;
    case "setColor": applyToSelection({c:v||null}); renderPanel(); break;
    case "clearAnn": applyToSelection({s:null,c:null,m:null}); renderPanel(); break;
    case "focusApi": UI.sel=new Set([v]); UI.anchor=null; UI.ptab="sel"; renderMatrix(); renderPanel();
      { const el=document.querySelector(`.cell[data-api="${CSS.escape(v)}"]`); if(el) el.scrollIntoView({block:"center",inline:"center",behavior:"smooth"}); } break;
    case "fitGradient": fitGradient(l); touch(l); renderMatrix(); renderPanel(); break;
    case "gradPreset": l.gradient.colors=GRADIENTS[+v].colors.slice(); touch(l); renderMatrix(); renderPanel(); break;
    case "exportLayer": saveFile(`malapi-capa-${slug(l.name)}.json`,JSON.stringify(layerExport(l),null,2),"application/json"); break;
    case "exportCsv": saveFile(`malapi-capa-${slug(l.name)}.csv`,exportCsv(l),"text/csv"); break;
    case "exportAll": saveFile(`malapi-capas-${today()}.json`,JSON.stringify({format:"malapi-workspace",version:1,exported:new Date().toISOString(),weights:S.weights,layers:S.order.map(id=>layerExport(S.layers[id]))},null,2),"application/json"); break;
    case "duplicate": duplicateLayer(); break;
    case "recalc": if(l.recipe) recalcOverlay(l); break;
    case "moveLeft": case "moveRight": { const i=S.order.indexOf(l.id), j=i+(b.dataset.act==="moveLeft"?-1:1); if(j<0||j>=S.order.length) break; [S.order[i],S.order[j]]=[S.order[j],S.order[i]]; touch(null); renderTabs(); break; }
    case "clearLayer": clearActiveLayer(); break;
    case "clearCanvas": openClear(); break;
    case "deleteLayer": modal("Eliminar capa",`<p>Se va a eliminar “${esc(l.name)}” con sus ${Object.keys(l.entries).length} anotaciones. Si la necesitás después, exportala antes en JSON.</p>`,[{label:"Cancelar"},{label:"Eliminar",danger:true,onClick:()=>deleteLayer(l.id)}]); break;
    case "closePanel": $("#panel").classList.remove("open"); applyChrome(); break;
    case "exportMenu": openExportMenu(b); break;
    case "renderView": openRenderView(); break;
    case "exportXlsx": exportXlsx(false); break;
    case "lgAdd": { const used=new Set(legendItemsOf(l).map(x=>x.color)); const c=SWATCHES.find(x=>!used.has(x))||"#7d8a96";
      l.legend=[...legendItemsOf(l),{color:c,label:""}]; touch(l); renderPanel(); renderLegend();
      const ins=document.querySelectorAll('[data-lg="label"]'); if(ins.length) ins[ins.length-1].focus(); break; }
    case "lgUsed": { const have=new Set(legendItemsOf(l).map(x=>x.color.toLowerCase()));
      const add=[...new Set(Object.values(l.entries).map(x=>x.c).filter(Boolean).map(x=>x.toLowerCase()))].filter(x=>!have.has(x)).map(color=>({color,label:""}));
      l.legend=[...legendItemsOf(l),...add]; touch(l); renderPanel(); renderLegend(); break; }
    case "lgDel": l.legend=legendItemsOf(l).filter((_,i)=>i!==+v); touch(l); renderPanel(); renderLegend(); break;
    case "lgClear": l.legend=[]; touch(l); renderPanel(); renderLegend(); break;
    case "togglePanel": togglePanel(); break;
    case "toggleToolbar": S.prefs.hideToolbar=!S.prefs.hideToolbar; touch(null); applyChrome(); break;
    case "toggleLegend": S.prefs.hideLegend=!S.prefs.hideLegend; touch(null); applyChrome(); break;
    case "toggleTheme": S.prefs.theme=effectiveDark()?"light":"dark"; touch(null); applyChrome(); break;
    case "showPanel": if(isMobile()) openPanelMobile(); else { S.prefs.hidePanel=false; touch(null); applyChrome(); renderLegend(); } break;
    case "openPanel": openPanelMobile(); break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target; if(!t.dataset||!t.dataset.lg) return;
  const l=L(), i=+t.dataset.i, items=legendItemsOf(l); if(!items[i]) return;
  if(t.dataset.lg==="color") items[i].color=t.value.toLowerCase(); else items[i].label=t.value.slice(0,120);
  l.legend=items; touch(l); renderLegend();
});
document.addEventListener("change",e=>{
  const t=e.target; const l=L();
  switch(t.id){
    case "edScore": { const v=t.value.trim()===""?null:parseFloat(t.value); applyToSelection({s:v}); break; }
    case "edColor": applyToSelection({c:t.value}); renderPanel(); break;
    case "edComment": applyToSelection({m:t.value.trim()?t.value.slice(0,4000):null}); break;
    case "lyName": l.name=t.value.trim()||"Capa"; touch(l); renderTabs(); break;
    case "lyDesc": l.desc=t.value; touch(l); break;
    case "lySample": l.sample.name=t.value.trim(); touch(l); break;
    case "lyHash": l.sample.hash=t.value.trim(); touch(l); break;
    case "gMin": case "gMax": { const v=parseFloat(t.value); if(isFinite(v)){ l.gradient[t.id==="gMin"?"min":"max"]=v; touch(l); renderMatrix(); } break; }
    case "gC0": case "gC1": case "gC2": l.gradient.colors[+t.id.slice(2)]=t.value; touch(l); renderMatrix(); break;
    case "dll": UI.dll=t.value; renderMatrix(); break;
    case "show": S.prefs.show=t.value; touch(null); renderMatrix(); break;
    case "sort": S.prefs.sort=t.value; touch(null); renderMatrix(); break;
    case "colsByWeight": S.prefs.colsByWeight=t.checked; touch(null); renderMatrix(); break;
    case "dense": S.prefs.dense=t.checked; touch(null); renderMatrix(); break;
    case "fileIn": { const f=t.files&&t.files[0]; if(!f) break; const r=new FileReader(); r.onload=()=>importJsonText(r.result); r.onerror=()=>toast("No se pudo leer el archivo"); r.readAsText(f); break; }
  }
});
let qTimer=null;
$("#q").addEventListener("input",e=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ UI.q=e.target.value; renderMatrix(); },120); });
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(e.key==="Escape"&&$("#expMenu")){ closeExportMenu(); $("#ibExport").focus(); return; }
  if(tag==="input"||tag==="textarea"||tag==="select"||$("#dlg").open) return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&UNDO){ e.preventDefault(); undo(); return; }
  if(e.key==="/"){ e.preventDefault(); if(S.prefs.hideToolbar){ S.prefs.hideToolbar=false; touch(null); applyChrome(); } $("#q").focus(); return; }
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==="p"){ e.preventDefault(); togglePanel(); return; }
    if(k==="b"){ e.preventDefault(); S.prefs.hideToolbar=!S.prefs.hideToolbar; touch(null); applyChrome(); return; }
    if(k==="l"){ e.preventDefault(); S.prefs.hideLegend=!S.prefs.hideLegend; touch(null); applyChrome(); return; }
    if(k==="d"){ e.preventDefault(); S.prefs.theme=effectiveDark()?"light":"dark"; touch(null); applyChrome(); return; }
  }
  if(!UI.sel.size) return;
  if(/^[0-9]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); applyToSelection({s:+e.key}); renderPanel(); }
  else if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); applyToSelection({s:null,c:null,m:null}); renderPanel(); }
  else if(e.key==="Escape"){ UI.sel.clear(); renderMatrix(); renderPanel(); }
});

/* ---------- arranque ---------- */
(()=>{
  if(startHost()){ $("#matrix").innerHTML=`<div class="empty-col">Conectando con la aplicación local…</div>`; setTimeout(()=>{ if(store.mode!=="host") bootLocal(); },2500); }
  else bootLocal();
})();
</script>
